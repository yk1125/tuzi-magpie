name: Tuzi unsigned desktop packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vX.Y.Z or vX.Y.Z-beta.N)'
        default: 'v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tuzi-unsigned-build-${{ github.ref }}
  cancel-in-progress: false

# This workflow produces reviewable artifacts only. Publishing waits for the
# Test workflow, browser regression checks and the release checklist.
jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: amd64
          - runner: windows-latest
            platform: windows
            arch: amd64
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin application source; this branch only selects available runners.
          ref: 1c2695b38cf1c3fe3b47171a197475814ee9e072
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Windows packaging dependencies
        if: runner.os == 'Windows'
        run: choco install make nsis --yes --no-progress
      - name: Build and package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          python scripts/tuzi-magpie/package-release.py \
            --platform "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCH" \
            --version "$PACKAGE_VERSION" --output dist/packages
      - name: Windows install and uninstall
        if: runner.os == 'Windows'
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: ./scripts/tuzi-magpie/test-windows-installer.ps1 -Version $env:PACKAGE_VERSION
      - name: Linux package install and version
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/packages/*.deb
          scripts/tuzi-magpie/isolated.sh tuzi-magpie --version
          sudo apt-get remove -y tuzi-magpie
      - uses: actions/upload-artifact@v4
        with:
          name: tuzi-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
